proxy_intercept_errors on;
error_page 502 503 504 =503 /bestcrm-maintenance.html;

location = /bestcrm-maintenance.html {
    internal;
    alias /opt/bestcrm/shared/nginx/bestcrm-maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
}
