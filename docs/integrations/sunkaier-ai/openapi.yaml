{
  "openapi": "3.1.0",
  "info": {
    "title": "SUNKAIER AI Source integration",
    "version": "1.0.0",
    "description": "Default disabled. Source intake only; human CRM processing. No customer/opportunity browsing. URL path is included in the signature. Query strings are rejected."
  },
  "servers": [
    {
      "url": "/api/integrations/sunkaier-ai/v1"
    }
  ],
  "paths": {
    "/sources": {
      "post": {
        "summary": "Receive an AI Source, never create a Lead automatically",
        "parameters": [
          {
            "name": "X-Sunkaier-Key-Id",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Environment-managed key ID"
          },
          {
            "name": "X-Sunkaier-Timestamp",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Unix epoch seconds, within 300 seconds"
          },
          {
            "name": "X-Sunkaier-Nonce",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "16 to 128 URL-safe characters; fresh for every HTTP attempt"
          },
          {
            "name": "X-Sunkaier-Content-SHA256",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Lowercase SHA-256 of exact raw HTTP body; empty-body digest for GET"
          },
          {
            "name": "X-Sunkaier-Signature",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "HMAC-SHA256 hex over METHOD, full path, timestamp, nonce, body hash joined by LF"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Submission"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted or replayed result",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "submission_reference",
                    "status",
                    "reason_code"
                  ],
                  "properties": {
                    "submission_reference": {
                      "type": "string",
                      "format": "uuid"
                    },
                    "status": {
                      "type": "string",
                      "const": "received"
                    },
                    "reason_code": {
                      "type": "string"
                    }
                  }
                }
              }
            }
          },
          "201": {
            "description": "First receipt",
