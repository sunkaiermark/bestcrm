<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Source · BESTCRM</title><link rel="stylesheet" href="/ai-source-preview/style.css"></head><body><aside class="rail"><div class="brand">BESTCRM<small>SUNKAIER</small></div><p>业务管理</p><div>工作台</div><div>邮件中心</div><div class="active">AI Source</div><div>Lead 线索</div><div>商机管理</div><div>客户与联系人</div><small class="environment">本地预览 · 合成数据</small></aside><main><header class="fixed-header"><div class="heading"><div><p>获客管理</p><h1>AI Source</h1></div><div class="tools"><button id="form-demo">官网表单演示</button><button id="reset" class="secondary">重置演示</button></div></div><nav id="channels" aria-label="来源"><strong>来源</strong><button data-channel="AI 搜索" class="selected">AI 搜索</button><button data-channel="官网表单">官网表单</button><button data-channel="网络聊天">网络聊天</button><button data-channel="电话咨询">电话咨询</button></nav><div class="filterbar"><input id="search" type="search" placeholder="模糊查询：名称、企业、地区、内容（空格分词）" aria-label="搜索内容"><select id="status" aria-label="处理结果"><option>待处理</option><option>全部</option><option>归档保存</option><option>已关联</option><option>转入线索</option><option>关联商机</option><option>已删除</option></select><span id="count"></span><span class="preview">仅演示 · 不写入业务数据</span></div><div id="detail-heading" hidden><button id="back" class="secondary">← 返回来源列表</button><span>来源详情</span></div></header><section class="scroll-content" id="scroll-content"><div id="list-view"><table><thead><tr><th class="time-col">时间</th><th>内容名称</th><th class="view-col">查看</th></tr></thead><tbody id="rows"></tbody></table><div class="pagination"><span id="page-info"></span><div><button id="prev" class="secondary">上一页</button><button id="next" class="secondary">下一页</button></div></div><div id="empty" hidden>没有符合条件的来源</div></div><article id="detail-view" hidden></article></section></main><dialog id="action-dialog"><form id="action-form"><div class="dialog-heading"><h2 id="action-title"></h2><button type="button" id="cancel" class="secondary">取消</button></div><p>本地演示操作，不修改真实业务记录。</p><label id="target-label" hidden>选择商机<select id="target"><option value="">请选择合成商机</option><option>SYN-OPP-001 · 合成设备项目</option><option>SYN-OPP-002 · 合成扩建项目</option></select></label><label>处理说明<textarea id="note" maxlength="500" required></textarea></label><button type="submit">确认处理（演示）</button></form></dialog>
<dialog id="website-dialog"><form id="website-form"><div class="section-head"><h2>官网表单 → AI Source</h2><button type="button" id="website-cancel" class="icon-button" aria-label="关闭">×</button></div><p class="muted">仅本地合成数据演示。提交后进入来源列表，不创建 Lead。</p><label>公司或项目名称<input name="company" maxlength="100" placeholder="请输入虚构公司" required></label><label>联系邮箱<input name="email" type="email" maxlength="150" placeholder="visitor@example.invalid" required></label><label>需求描述<textarea name="requirement" rows="4" maxlength="1000" placeholder="请使用合成需求，不填写真实客户资料" required></textarea></label><div class="dialog-actions"><button class="button" type="submit">提交到 AI Source（演示）</button></div></form></dialog><div id="toast" role="status"></div><script src="/ai-source-preview/app.js"></script></body></html>
